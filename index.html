<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hubby! ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            animation: fadeIn 2s ease-in-out;
        }
        h1 {
            font-size: 2.5rem;
            color: #ff6b6b;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #dddddd;
        }
        .btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday,nana! 🎂</h1>
        <p>To my wonderful husband in London 🇬🇧</p>
        <p>Distance means so little when someone means so much. Even though we are miles apart today, my entire heart is celebrating you!</p>
        <button class="btn" onclick="revealWish()">Click for my Wish ❤️</button>
        <p id="hidden-wish" style="display:none; margin-top:20px; color:#feca57; font-weight:bold; animation: fadeIn 1s;"></p>
    </div>

    <script>
        function revealWish() {
            const wish = document.getElementById('hidden-wish');
            wish.innerHTML = "I wish you the happiest, most successful year ahead. Can't wait until the countdown to being together runs out! Have an amazing day! 😘🎉";
            wish.style.display = 'block';
            console.log("%cI love you to the moon and back! ❤️", "color: #ff6b6b; font-size: 20px; font-weight: bold;");
        }
    </script>
</body>
</html>
